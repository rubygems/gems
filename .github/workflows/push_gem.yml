name: Push Gem

# Pushing a version tag, which `rake release` does, checks the tag with CI and then pushes the gem to RubyGems.org
# with trusted publishing
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docs:
    uses: ./.github/workflows/docs.yml
  lint:
    uses: ./.github/workflows/lint.yml
  mutant:
    uses: ./.github/workflows/mutant.yml
  steep:
    uses: ./.github/workflows/steep.yml
  test:
    uses: ./.github/workflows/test.yml

  push:
    needs: [docs, lint, mutant, steep, test]
    if: github.repository == 'rubygems/gems'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # Set up
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true
          ruby-version: ruby

      # The release task tags the version it builds when that tag is missing, so a tag that names another version
      # would push a gem and a tag nobody asked for
      - name: Check that the tag names the version
        run: ruby -r ./lib/gems/library_version -e 'abort "#{ARGV[0]} is not v#{Gems::VERSION}" unless ARGV[0] == "v#{Gems::VERSION}"' "$GITHUB_REF_NAME"

      # Release
      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
