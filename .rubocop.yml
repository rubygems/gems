plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - standard-custom
  - standard-performance

inherit_gem:
  standard: config/ruby-3.4.yml

AllCops:
  NewCops: enable

# Standard leaves this off; the library freezes its string literals
Style/FrozenStringLiteralComment:
  Enabled: true

# Standard disables the Metrics cops; enforce them at RuboCop's defaults
Metrics/AbcSize:
  Enabled: true

Metrics/BlockLength:
  Enabled: true

Metrics/BlockNesting:
  Enabled: true

Metrics/ClassLength:
  Enabled: true

Metrics/CollectionLiteralLength:
  Enabled: true

Metrics/CyclomaticComplexity:
  Enabled: true

Metrics/MethodLength:
  Enabled: true

Metrics/ModuleLength:
  Enabled: true

Metrics/ParameterLists:
  Enabled: true
  CountKeywordArgs: false

Metrics/PerceivedComplexity:
  Enabled: true

# Name the spec of OIDCIDToken as its file is named, which the cop cannot tell from the run of capitals
RSpec/SpecFilePathFormat:
  CustomTransform:
    OIDCIDToken: oidc_id_token
